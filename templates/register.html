<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(
135deg,
#fc466b,
#3f5efb
);
}

.card{
width:400px;
padding:40px;
background:rgba(255,255,255,0.12);
backdrop-filter:blur(15px);
border-radius:25px;
box-shadow:0 8px 32px rgba(0,0,0,.2);
color:white;
}

.card h1{
text-align:center;
margin-bottom:25px;
}

input{
width:100%;
padding:14px;
margin:10px 0;
border:none;
border-radius:12px;
outline:none;
}

button{
width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:12px;
cursor:pointer;
background:white;
font-weight:700;
color:#fc466b;
}

a{
color:white;
font-weight:600;
}

p{
margin-top:20px;
text-align:center;
}

.error{
background:red;
padding:10px;
border-radius:10px;
margin-bottom:10px;
}

</style>
</head>

<body>

<div class="card">

<h1>Create Account 🚀</h1>

{% if error %}
<div class="error">
{{ error }}
</div>
{% endif %}

<form method="post">

<input
type="text"
name="username"
placeholder="Username"
required
>
<input
type="text"
name="name"
placeholder="Full Name"
required
>

<input
type="password"
name="password"
placeholder="Password"
required
>

<button type="submit">
Register
</button>

</form>

<p>
Already have account?
<a href="/login">Login</a>
</p>

</div>

</body>
</html>
