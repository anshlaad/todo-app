<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>



<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">



<style>



*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:'Poppins',sans-serif;

}



body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(

135deg,

#6a11cb,

#2575fc

);

overflow:hidden;

}



.card{

width:400px;

padding:40px;

background:rgba(255,255,255,0.12);

backdrop-filter:blur(15px);

border-radius:25px;

box-shadow:0 8px 32px rgba(0,0,0,.2);

color:white;

}



.card h1{

text-align:center;

margin-bottom:25px;

}



input{

width:100%;

padding:14px;

margin:10px 0;

border:none;

outline:none;

border-radius:12px;

}



button{

width:100%;

padding:14px;

margin-top:15px;

border:none;

border-radius:12px;

cursor:pointer;

background:white;

color:#6a11cb;

font-weight:700;

transition:.3s;

}



button:hover{

transform:translateY(-3px);

}



a{

color:white;

font-weight:600;

}



p{

margin-top:20px;

text-align:center;

}



.error{

background:#ff4d4d;

padding:10px;

border-radius:10px;

margin-bottom:10px;

text-align:center;

}



</style>

</head>



<body>



<div class="card">



<h1>Welcome Back 👋</h1>



{% if error %}

<div class="error">

{{ error }}

</div>

{% endif %}



<form method="post">



<input

type="text"

name="username"

placeholder="Username"

required

>



<input

type="password"

name="password"

placeholder="Password"

required

>



<button type="submit">

Login

</button>



</form>



<p>

Don't have an account?

<a href="/register">Register</a>

</p>



</div>



</body>

</html>
